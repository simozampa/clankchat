name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24.19.0]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Smoke-test packed binaries
        run: |
          archive="$(npm pack --silent)"
          npm install --global "./${archive}"
          clankerchat --version
          repository="$(mktemp -d)"
          home="$(mktemp -d)"
          git -C "$repository" init
          HOME="$home" clankerchat --cwd "$repository" setup --opencode
          outside="$(mktemp -d)"
          state="$(mktemp -d)"
          XDG_STATE_HOME="$state" clankerchat --cwd "$outside" --agent ci-global status | node -e '
            let input=""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => {
              if (JSON.parse(input).scope !== "global") process.exit(1);
            });
          '
          if XDG_STATE_HOME="$state" clankerchat --cwd "$outside" --scope repository --agent strict status; then exit 1; fi
          user_home="$(mktemp -d)"
          HOME="$user_home" XDG_CONFIG_HOME="$user_home/config" XDG_STATE_HOME="$user_home/state" \
            clankerchat --cwd "$outside" setup --user --opencode
          test -f "$user_home/config/opencode/opencode.json"
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          response="$(CONFIG="$user_home/config/opencode/opencode.json" REQUEST="$request" REPOSITORY="$repository" node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import path from "node:path";
            import { spawnSync } from "node:child_process";
            const server = JSON.parse(readFileSync(process.env.CONFIG, "utf8")).mcp?.clankerchat;
            if (!Array.isArray(server?.command) || server.command.length !== 2 ||
                server.command.some((entry) => typeof entry !== "string" || !path.isAbsolute(entry)) ||
                server.command.some((entry) => !existsSync(entry))) process.exit(1);
            const result = spawnSync(server.command[0], server.command.slice(1), {
              input: `${process.env.REQUEST}\n`, encoding: "utf8", timeout: 10_000,
              env: { ...process.env, ...server.environment, CLANKERCHAT_CWD: process.env.REPOSITORY, CLANKERCHAT_AGENT: "ci-agent" },
            });
            if (result.status !== 0) process.exit(1);
            process.stdout.write(result.stdout);
          ')"
          node -e 'const value=JSON.parse(process.argv[1]); if (value.result?.serverInfo?.name !== "clankerchat") process.exit(1)' "$response"
          lines="$(wc -l src/*.ts | tail -n 1 | tr -s ' ' | cut -d ' ' -f 2)"
          test "$lines" -lt 6000
