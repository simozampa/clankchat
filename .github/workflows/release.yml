name: Publish Package

on:
  push:
    tags:
      - 'clankerchat-v*'

permissions:
  contents: read

concurrency:
  group: clankerchat-npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify tag and package identity
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./package.json').name")" = "clankerchat"
          test "$GITHUB_REF_NAME" = "clankerchat-v${version}"
          node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.argv[1])) process.exit(1)' "$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build release archive
        id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          archive="$(npm pack --ignore-scripts --silent)"
          test "$archive" = "clankerchat-${version}.tgz"
          package_json="$(tar -xOf "$archive" package/package.json)"
          node -e '
            const value = JSON.parse(process.argv[1]);
            if (value.name !== "clankerchat" || value.version !== process.argv[2]) process.exit(1);
            if (value.bin?.clankerchat !== "dist/cli.js" || value.bin?.["clankerchat-mcp"] !== "dist/mcp.js") process.exit(1);
            if (value.repository?.url !== "git+https://github.com/simozampa/clankerchat.git") process.exit(1);
            if (value.publishConfig?.registry || value.publishConfig?.provenance === false) process.exit(1);
          ' "$package_json" "$version"
          tar -tzf "$archive" | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const files = input.trim().split("\n").sort();
            const modules = [
              "activity", "adapters", "cli-main", "cli", "codex", "database", "doctor",
              "errors", "files", "git", "index", "line", "mcp-server", "mcp", "paths",
              "setup", "types", "version", "watch",
            ];
            const expected = [
              ".claude-plugin/marketplace.json", "CODE_OF_CONDUCT.md", "CONTRIBUTING.md",
              "LICENSE", "README.md", "SECURITY.md", "docs/landscape.md", "docs/protocol.md",
              "npm-shrinkwrap.json", "package.json",
              "plugins/clankerchat/.claude-plugin/plugin.json",
              "plugins/clankerchat/bin/inbox-monitor.sh",
              "plugins/clankerchat/hooks/capture-pinned.mjs",
              "plugins/clankerchat/hooks/hooks.json",
              "plugins/clankerchat/monitors/monitors.json",
              "plugins/clankerchat/skills/clankerchat/SKILL.md",
              ...modules.flatMap((name) => [`dist/${name}.d.ts`, `dist/${name}.js`, `dist/${name}.js.map`]),
            ].map((name) => `package/${name}`).sort();
            if (JSON.stringify(files) !== JSON.stringify(expected)) process.exit(1);
          '
          sha256sum "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke-test release archive
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" "./${ARCHIVE}"
          "$prefix/bin/clankerchat" --version
          repository="$(mktemp -d)"
          home="$(mktemp -d)"
          git -C "$repository" init
          HOME="$home" "$prefix/bin/clankerchat" --cwd "$repository" setup --opencode
          outside="$(mktemp -d)"
          state="$(mktemp -d)"
          XDG_STATE_HOME="$state" "$prefix/bin/clankerchat" --cwd "$outside" --agent release-global status | node -e '
            let input=""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => {
              if (JSON.parse(input).scope !== "global") process.exit(1);
            });
          '
          if XDG_STATE_HOME="$state" "$prefix/bin/clankerchat" --cwd "$outside" --scope repository --agent strict status; then exit 1; fi
          user_home="$(mktemp -d)"
          HOME="$user_home" XDG_CONFIG_HOME="$user_home/config" XDG_STATE_HOME="$user_home/state" \
            "$prefix/bin/clankerchat" --cwd "$outside" setup --user --opencode
          test -f "$user_home/config/opencode/opencode.json"
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release","version":"1"}}}'
          response="$(CONFIG="$user_home/config/opencode/opencode.json" REQUEST="$request" REPOSITORY="$repository" node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import path from "node:path";
            import { spawnSync } from "node:child_process";
            const server = JSON.parse(readFileSync(process.env.CONFIG, "utf8")).mcp?.clankerchat;
            if (!Array.isArray(server?.command) || server.command.length !== 2 ||
                server.command.some((entry) => typeof entry !== "string" || !path.isAbsolute(entry)) ||
                server.command.some((entry) => !existsSync(entry))) process.exit(1);
            const result = spawnSync(server.command[0], server.command.slice(1), {
              input: `${process.env.REQUEST}\n`, encoding: "utf8", timeout: 10_000,
              env: { ...process.env, ...server.environment, CLANKERCHAT_CWD: process.env.REPOSITORY, CLANKERCHAT_AGENT: "release-agent" },
            });
            if (result.status !== 0) process.exit(1);
            process.stdout.write(result.stdout);
          ')"
          node -e 'const value=JSON.parse(process.argv[1]); if (value.result?.serverInfo?.name !== "clankerchat") process.exit(1)' "$response"

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clankerchat-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clankerchat-${{ needs.verify.outputs.version }}

      - name: Verify release archive
        id: package
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          sha256sum --check "clankerchat-${EXPECTED_VERSION}.tgz.sha256"
          package_json="$(tar -xOf "clankerchat-${EXPECTED_VERSION}.tgz" package/package.json)"
          node -e '
            const value = JSON.parse(process.argv[1]);
            if (value.name !== "clankerchat" || value.version !== process.env.EXPECTED_VERSION) {
              process.exit(1);
            }
          ' "$package_json"
          echo "archive=clankerchat-${EXPECTED_VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted-publishing prerequisites
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              process.exit(1);
            }
          ' "$(npm --version)"
          maintainers="$(npm view clankerchat maintainers --json)"
          node -e '
            const maintainers = JSON.parse(process.argv[1]);
            if (!Array.isArray(maintainers)) process.exit(1);
            const names = [...new Set(maintainers.map((value) => typeof value === "string" ? value.split(/\s/u, 1)[0] : value?.name))].sort();
            if (JSON.stringify(names) !== JSON.stringify(["simozampa"])) process.exit(1);
          ' "$maintainers"
          versions="$(npm view clankerchat versions --json)"
          node -e '
            const versions = JSON.parse(process.argv[1]);
            const published = Array.isArray(versions) ? versions : [versions];
            if (published.includes(process.env.EXPECTED_VERSION)) process.exit(1);
          ' "$versions"
          VERSIONS="$versions" node -e '
            const parse = (value) => {
              const match = value.match(/^(\d+)\.(\d+)\.(\d+)$/u);
              if (!match) process.exit(1);
              return match.slice(1).map(Number);
            };
            const current = parse(process.env.EXPECTED_VERSION);
            const values = JSON.parse(process.env.VERSIONS);
            const published = Array.isArray(values) ? values : [values];
            for (const value of published) {
              const previous = parse(value);
              let order = 0;
              for (let index = 0; index < 3 && order === 0; index += 1) {
                order = current[index] - previous[index];
              }
              if (order <= 0) process.exit(1);
            }
          '

      - name: Publish package
        run: npm publish "${{ steps.package.outputs.archive }}" --access public --tag latest --registry https://registry.npmjs.org --provenance
